[project]
name = "rvt"
version = "0.1.0"
description = "Read (and eventually write) Autodesk Revit .rvt files"
requires-python = ">=3.11"
dependencies = ["olefile>=0.47"]

[project.scripts]
rvtinspect = "rvt.cli:main"
rvt-roundtrip = "rvt.roundtrip:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
