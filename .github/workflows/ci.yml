name: CI

# CI v1 (issue #2). Three humans' sessions need one shared definition of green.
# Deliberately does NOT run the full ~1,700-test suite (~25 min) — see
# docs/inbox/SUITE-COORDINATION.md. The per-PR shard is tests/ci_shard.txt + the tests/ci_shard.d/*.txt
# drop-ins (#328), merged and validated by tools/dev/shard_list.py — the same helper session_ci.sh uses.

on:
  # steer #302: no GitHub-hosted compute. Every event/schedule trigger is off; the file is kept as the
  # reference design and can be run by hand (workflow_dispatch) if minutes ever exist again. The live
  # pipeline is session-hosted: docs/process/AUTONOMY.md section 12c, tools/dev/session_ci.sh.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      RVT_SKIP_LARGE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy

      - name: Portable paths
        run: python tools/dev/check_portable_paths.py

      - name: Plugin drift guard
        run: python tools/sync_plugin.py --check

      - name: Plugin structure
        run: python plugin/scripts/validate_plugin.py

      - name: Fast test shard
        run: |
          SHARD_TXT=$(python tools/dev/shard_list.py --print)   # a refused/empty list fails the step here (bash -e)
          mapfile -t SHARD <<<"$SHARD_TXT"
          printf 'shard: %s\n' "${SHARD[@]}"
          python -m pytest -q --durations=10 -- "${SHARD[@]}"
