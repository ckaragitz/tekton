name: board

# The official task board: ONE pinned issue (label `board`) whose body is re-rendered from
# live GitHub state — in progress / in review with the exact merge blocker per PR / next up /
# waiting on a human / untriaged steers / done this week / bot health — plus the hygiene the
# merge bots do not do (re-queue issues whose PR is `bot-stuck`, free dead worker leases,
# nudge then close drafts nobody touches). Token-free: built-in GITHUB_TOKEN only, so it
# works whether or not the model-backed bots are on. Logic: tools/dev/techlead.py (board,
# sweep) — change that file, not this one (workflow edits need the owner to merge).
# Events raised by our own bots' GITHUB_TOKEN do not re-trigger workflows, so no loops.

on:
  # Bounded on purpose: a 20-min cron plus the few events that change the picture for a human
  # (issues/PRs opening, closing, becoming ready). Label/assignment storms from a planner pass and
  # `workflow_run` fan-out are NOT triggers — they produced 30 runs in 3 minutes on day one (#64).
  # State-changing bots refresh the board explicitly instead: automerge after a merge, the planner
  # and the worker at the end of a run (`gh workflow run board.yml`).
  issues:
    types: [opened, closed, reopened]
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "*/20 * * * *"       # cheap: the render exits in seconds when the body is unchanged
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read                 # CI state per PR head
  actions: read                # bot health line

concurrency:
  group: board
  # Debounce without paying for it (#300): while one render runs, later events collapse into ONE
  # pending run (GitHub supersedes older pending runs before they start — zero runner minutes),
  # which then renders the settled state. cancel-in-progress used to kill renders that had already
  # been billed a minute while sitting in a `sleep`.
  cancel-in-progress: false

jobs:
  render:
    # The board's own edits arrive via GITHUB_TOKEN and trigger nothing (no loops). Its check run
    # can land on a PR head via pull_request_target; the merge gate ignores bot jobs by name (#64).
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: |
            tools/dev
            .github
      - name: Sweep + render the board issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/dev/techlead.py board
