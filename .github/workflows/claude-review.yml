name: claude-review

# Automatic review of every PR push, with a machine-readable verdict, plus a bounded fix pass
# that is DISPATCHED, never immediate. Flow per head SHA:
#   review (≤80 turns) -> verdict marker  <!-- claude-review: approve|nits|changes sha=<sha> -->
#   no marker (turn cap / crash) -> a short "verdict rescue" pass posts it; still none -> red, and
#                                    automerge re-requests the review once (workflow_dispatch, mode=review)
#   CI red or verdict `changes`  -> NOTHING here. A live coding session subscribed to the PR fixes it
#                                    first (steer #67: one owner per step, no session/bot double-fixing).
#                                    Only after pipeline.fix_grace_minutes (default 15) with no new push
#                                    does automerge dispatch job `fix` below (mode=fix) for the current
#                                    head — which is also how a PR whose session or laptop went away is
#                                    picked up. `fix` handles red CI and review findings in one pass,
#                                    keeps the reset-aware budget (attempt markers since the last
#                                    <!-- claude-autofix reset -->), and at the cap labels `bot-stuck`
#                                    (NOT a human dead-end: the board's sweep re-queues the issue).
# Knobs live in .github/autonomy.json on the default branch (pipeline.max_fix_attempts, fix_grace_minutes).
# automerge.yml merges when CI is green AND the verdict for the exact head SHA is approve/nits.
#
# Needs ONE repo secret set by the repo admin (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  (`claude setup-token` on a Pro/Max plan)  — or —  ANTHROPIC_API_KEY
# plus the Claude GitHub App installed on the repo (github.com/apps/claude).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:       # automerge (or a human: Actions → claude-review → Run): re-review, or the fix pass
    inputs:
      pr:
        description: "PR number, at its current head"
        required: true
      mode:
        description: "review (default) | fix — the fix pass is only ever dispatched (by automerge, after the grace window)"
        required: false
        default: "review"

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}-${{ inputs.mode || 'review' }}
  cancel-in-progress: true

env:
  # Shared bash for both jobs, loaded with:  eval "$REVIEW_LIB"   (needs GH_TOKEN, REPO, and $comments
  # = the PR's comments as JSON). The markers are the contract with automerge.yml and
  # tools/dev/techlead.py (tests/test_techlead.py pins them): verdict, attempt, reset, exhausted.
  REVIEW_LIB: |
    cfg_max_fix() {   # pipeline.max_fix_attempts from the DEFAULT branch's .github/autonomy.json
      local d; d=$(gh api "repos/$REPO" --jq .default_branch)
      gh api "repos/$REPO/contents/.github/autonomy.json?ref=$d" --jq .content 2>/dev/null | base64 -d 2>/dev/null | jq -r '.pipeline.max_fix_attempts // 3' 2>/dev/null || echo 3
    }
    # attempts = auto-fix attempt markers since the last budget reset marker (posted when an
    # issue is re-queued to a fresh holder), in comment order.
    attempts_since_reset() {
      jq -r '[.[].body] | reduce .[] as $b (0; if ($b|contains("<!-- claude-autofix reset -->")) then 0 elif ($b|test("<!-- claude-autofix attempt=[0-9]+ -->")) then .+1 else . end)' <<<"$comments"
    }
    # verdict_of <sha>: newest verdict marker in $comments (JSON) whose sha field is a >=12-hex prefix of <sha>.
    verdict_of() {   # `|| true`: a no-match grep must not fail the step under pipefail
      { jq -r '.[].body' <<<"$comments" | grep -oE "<!-- claude-review: (approve|nits|changes) sha=[0-9a-f]{12,40} -->" || true; } \
        | awk -v s="$1" '{ split($4, kv, "="); if (index(s, kv[2]) == 1) v = $3 } END { print v }'
    }
    park_stuck() {    # $1=pr $2=sha $3=why — label bot-stuck + one explanatory comment per sha (never needs-human)
      gh label create bot-stuck --repo "$REPO" --color b60205 >/dev/null 2>&1 || true
      gh pr edit "$1" --repo "$REPO" --add-label bot-stuck >/dev/null
      if ! jq -r '.[].body' <<<"$comments" | grep -qF "<!-- claude-autofix exhausted sha=$2 -->"; then
        gh pr comment "$1" --repo "$REPO" --body "🤖 **Out of automatic fix attempts** and $3. Labelled \`bot-stuck\` — this is not a dead end: if nothing moves for a day, the board's sweep re-queues the linked issue (\`ready\` + \`retry\`) so a fresh session or the unattended worker continues **on this branch** with a new budget. Anyone may act sooner: push a fix, comment \`@claude <specific instruction>\`, or \`/claim\` the issue. <!-- claude-autofix exhausted sha=$2 -->" >/dev/null
      fi
    }

jobs:
  claude-review:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'fix')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read              # the reviewer / fixer may verify CI state on the head themselves
    steps:
      - name: Require a credential (fail red, never skip quietly)
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repo secret. Repo admin: run 'claude setup-token' locally and add it as CLAUDE_CODE_OAUTH_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Resolve the PR under review
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EV_PR: ${{ github.event.pull_request.number }}
          IN_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr="${EV_PR:-$IN_PR}"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::pr input must be a number, got '$pr'"; exit 1; }
          j=$(gh pr view "$pr" --repo "$REPO" --json number,headRefOid,headRefName,isDraft,state)
          [ "$(jq -r .state <<<"$j")" = "OPEN" ] || { echo "::error::PR #$pr is not open"; exit 1; }
          eval "$REVIEW_LIB"
          {
            echo "pr=$pr"
            echo "sha=$(jq -r .headRefOid <<<"$j")"
            echo "ref=$(jq -r .headRefName <<<"$j")"
            echo "draft=$(jq -r .isDraft <<<"$j")"
            echo "max_fix=$(cfg_max_fix)"
          } >> "$GITHUB_OUTPUT"
          echo "reviewing #$pr at $(jq -r .headRefOid <<<"$j") ($EVENT)"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ctx.outputs.sha }}
          fetch-depth: 0

      - name: Review
        id: review
        continue-on-error: true      # a turn-cap exit must not skip the verdict rescue below
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "github-actions[bot],github-actions,claude[bot],claude"   # our own bots dispatch/author these runs (automerge, coord, planner, worker); default rejects every non-human actor
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.ctx.outputs.pr }}
            HEAD SHA: ${{ steps.ctx.outputs.sha }}

            You are the automated reviewer AND the merge gatekeeper for this repository; the
            contributors are not developers, so your verdict decides whether this PR merges.
            Read CLAUDE.md at the repo root first — sections 1 (hard rules), 3b (plugin sources vs
            generated mirrors) and 4 (PR requirements) are the standard. Review ONLY this PR's diff
            (`gh pr diff`), reading full files where needed to judge correctness. Also read the
            linked issue (`Closes #N` → `gh issue view N`) and check its DONE criteria are met, and
            run `gh pr list --state open` to detect another open PR for the same issue.
            Budget your turns: post the summary comment (step 2 below) BEFORE you run out — a review
            without the verdict marker is worthless to the merge machinery.

            Blocking (→ verdict `changes`):
            - hard-rule violations (refusal logic instead of labels; reading Autodesk install dirs;
              donor/sample-derived bytes entering src/ tools/ plugin/ skills/; secrets; non-portable paths)
            - correctness bugs with a concrete failure scenario
            - edits to GENERATED mirrors (plugin/lib/**, plugin/skills/*/scripts/*.py except _bootstrap.py,
              plugin/skills/tekton-ifc/**, plugin/assets/**, plugin/marketplace.json) instead of sources,
              or src/tools/skills edits without the synced mirror (`tools/sync_plugin.py`)
            - the linked issue's DONE clearly not met, or no linked issue at all
            - a "loads/opens in Revit" claim without a docs/coverage/viewer-certified.json entry
            - this PR duplicates an OLDER open PR for the same issue (say which; the older one wins)
            Non-blocking (→ `nits`): style, record bookkeeping, small hygiene gaps, optional improvements.
            A PR opened by the unattended worker (branch `bot/…`, author claude[bot]) is held to exactly
            the same standard — no bonus, no penalty.

            Output, in this order:
            1. Inline comments for line-anchored findings (only real ones).
            2. Exactly ONE summary comment via `gh pr comment`, starting with a verdict line —
               `✅ Approve`, `🟡 Nits only`, or `🛑 Changes requested` — then ≤8 bullets, most severe
               first, each with file:line and the concrete failure scenario or the exact fix wanted.
               Write for a non-developer's coding assistant: each blocking bullet must say precisely
               what to change. No praise padding, no diff restating.
            3. The LAST line of that summary comment must be exactly one of:
               <!-- claude-review: approve sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: nits sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: changes sha=${{ steps.ctx.outputs.sha }} -->
            Do not push commits in this step.
          claude_args: |
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Glob,Grep"

      - name: Verdict marker present?
        id: v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          set -euo pipefail
          eval "$REVIEW_LIB"
          # shellcheck disable=SC2034   # read by verdict_of (eval'd from REVIEW_LIB)
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate)
          if [ -n "$(verdict_of "$SHA")" ]; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"; echo "::warning::review pass ended without a verdict marker for $SHA (outcome: ${{ steps.review.outcome }}) — running the rescue pass"
          fi

      - name: Verdict rescue (short second pass, only when the marker is missing)
        if: steps.v1.outputs.found != 'yes'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "github-actions[bot],github-actions,claude[bot],claude"   # our own bots dispatch/author these runs (automerge, coord, planner, worker); default rejects every non-human actor
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}   PR: ${{ steps.ctx.outputs.pr }}   HEAD SHA: ${{ steps.ctx.outputs.sha }}
            A review pass of this PR just ended WITHOUT posting its verdict (it ran out of turns or
            crashed). Your only job: post the ONE summary comment with the verdict, fast.
            1. `gh pr view ${{ steps.ctx.outputs.pr }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ steps.ctx.outputs.pr }}/comments`
               to read any inline findings the first pass already left; `gh pr diff` to see the change;
               read CLAUDE.md §1 if you need the hard rules. Do not re-review from scratch beyond what a
               verdict needs; do not post inline comments; do not push.
            2. Post exactly ONE `gh pr comment`: first line `✅ Approve`, `🟡 Nits only` or `🛑 Changes requested`,
               ≤6 bullets (blocking ones say exactly what to change), LAST line exactly one of:
               <!-- claude-review: approve sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: nits sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: changes sha=${{ steps.ctx.outputs.sha }} -->
               When genuinely unable to judge, choose `changes` and say what a reviewer must check —
               never approve blind.
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(gh issue view:*),Read,Grep,Glob"

      - name: Read verdict, keep the budget honest
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
          MAX_FIX_ATTEMPTS: ${{ steps.ctx.outputs.max_fix }}
        run: |
          set -euo pipefail
          eval "$REVIEW_LIB"
          # shellcheck disable=SC2034   # read by verdict_of / attempts_since_reset (eval'd from REVIEW_LIB)
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate)
          verdict=$(verdict_of "$SHA")
          attempts=$(attempts_since_reset)
          [ -z "$verdict" ] && { echo "::error::no verdict marker for $SHA even after the rescue pass — automerge re-requests this review once, then parks the PR as bot-stuck (a PR that edits this very workflow can never be bot-reviewed: the action refuses modified copies; a session merges it)"; exit 1; }
          echo "verdict=$verdict attempts=$attempts/$MAX_FIX_ATTEMPTS"
          # No fix pass here: a live session goes first; automerge dispatches job `fix` after the
          # grace window if the head is still red / requesting changes (steer #67).
          if [ "$verdict" = "changes" ] && [ "$attempts" -ge "$MAX_FIX_ATTEMPTS" ]; then
            park_stuck "$PR" "$SHA" "the review still requests changes after $attempts fix attempt(s) since the last budget reset"
          fi

  fix:
    # The bounded fix pass — ONLY on workflow_dispatch mode=fix, which automerge sends once the grace
    # window after the last signal (push / red CI / 🛑 verdict / previous attempt) has passed with no
    # new push. Handles red CI and review findings for the PR's CURRENT head in one pass.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      checks: read              # the reviewer / fixer may verify CI state on the head themselves
    steps:
      - name: Require a credential (fail red, never skip quietly)
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then echo "::error::No CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secret — cannot run the fix pass."; exit 1; fi
      - name: Resolve the PR, the budget, and what is wrong at its head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IN_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          eval "$REVIEW_LIB"
          [[ "$IN_PR" =~ ^[0-9]+$ ]] || { echo "::error::pr input must be a number"; exit 1; }
          j=$(gh pr view "$IN_PR" --repo "$REPO" --json state,headRefOid,headRefName,isCrossRepository)
          [ "$(jq -r .state <<<"$j")" = "OPEN" ] || { echo "PR #$IN_PR is not open — nothing to fix"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$(jq -r .isCrossRepository <<<"$j")" = "false" ] || { echo "PR #$IN_PR comes from a fork — not pushing there"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; }
          sha=$(jq -r .headRefOid <<<"$j"); ref=$(jq -r .headRefName <<<"$j")
          max=$(cfg_max_fix)
          # shellcheck disable=SC2034   # read by verdict_of / attempts_since_reset (eval'd from REVIEW_LIB)
          comments=$(gh api "repos/$REPO/issues/$IN_PR/comments" --paginate)
          attempts=$(attempts_since_reset)
          if [ "$attempts" -ge "$max" ]; then
            park_stuck "$IN_PR" "$sha" "the fix budget ($max since the last reset) is spent"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # What is wrong at THIS head: red CI (latest CI run for the sha) and/or a `changes` verdict.
          run_id=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$sha" --limit 5 --json databaseId,conclusion,status \
                     --jq '[.[]|select(.status=="completed")][0] | if . == null then "" else "\(.databaseId) \(.conclusion)" end')
          ci_red=no
          if [ -n "$run_id" ] && [ "${run_id#* }" != "success" ]; then
            ci_red=yes; gh run view "${run_id% *}" --repo "$REPO" --log-failed 2>/dev/null | tail -300 > /tmp/ci-failed.log || true
          fi
          verdict=$(verdict_of "$sha")
          if [ "$ci_red" = "no" ] && [ "$verdict" != "changes" ]; then
            echo "head ${sha:0:7}: CI not red and verdict is '${verdict:-none}' — nothing to fix (a session probably pushed first)"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "go=yes"; echo "pr=$IN_PR"; echo "sha=$sha"; echo "ref=$ref"; echo "attempts=$attempts"; echo "max=$max"
            echo "ci_red=$ci_red"; echo "verdict=${verdict:-none}"; echo "run_id=${run_id% *}"; } >> "$GITHUB_OUTPUT"
          echo "fixing #$IN_PR at ${sha:0:7}: ci_red=$ci_red verdict=${verdict:-none} attempt $((attempts+1))/$max"
      - uses: actions/checkout@v6
        if: steps.pr.outputs.go == 'yes'
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
      - name: Prepare the branch and the Python env
        if: steps.pr.outputs.go == 'yes'
        env:
          REF: ${{ steps.pr.outputs.ref }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git checkout -B "$REF" "$SHA"
          git config user.name  "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          bash scripts/cloud-setup.sh || echo "::warning::cloud-setup.sh failed; the fix pass runs without a prepared venv"
      - name: Fix pass (bounded, dispatched after the grace window)
        if: steps.pr.outputs.go == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "github-actions[bot],github-actions,claude[bot],claude"   # our own bots dispatch/author these runs (automerge, coord, planner, worker); default rejects every non-human actor
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}   PR: #${{ steps.pr.outputs.pr }}   BRANCH: ${{ steps.pr.outputs.ref }}   HEAD: ${{ steps.pr.outputs.sha }}
            This is automatic fix attempt ${{ steps.pr.outputs.attempts }} + 1 of ${{ steps.pr.outputs.max }}, dispatched because
            no session pushed a fix within the grace window. At this head: CI red = ${{ steps.pr.outputs.ci_red }};
            review verdict = ${{ steps.pr.outputs.verdict }}.

            Read CLAUDE.md first (§1 hard rules, §3b sources vs generated mirrors, §4). Then:
            - If CI is red: the failed-step log tail is at /tmp/ci-failed.log (also `gh run view ${{ steps.pr.outputs.run_id }} --log-failed`).
              Diagnose the real failure (portable paths / sync_plugin drift / validate_plugin / a test in tests/ci_shard.txt).
            - If the verdict is `changes`: read the latest review summary + inline comments (`gh pr view --comments`,
              `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.pr }}/comments`) and address every BLOCKING bullet.
              If a bullet says this PR duplicates an older open PR, do NOT fix code: comment recommending closure and stop.
            Make the smallest correct change inside the linked issue's territory — never weaken a gate or delete a test to
            go green; if the right fix is outside the territory or needs samples/viewer/a human decision, say so in a comment
            and stop. On the LAST attempt (attempt + 1 == max) prefer the change that certainly clears the blockers even if it
            narrows scope, and file the narrowed-out remainder as a follow-up issue (`gh issue create`, title = checkable DONE,
            labels ready + area).
            After editing: if you touched src/, tools/ or skills/, run `.venv/bin/python tools/sync_plugin.py`; then run exactly
            what CI runs: `.venv/bin/python tools/dev/check_portable_paths.py`, `.venv/bin/python tools/sync_plugin.py --check`,
            `.venv/bin/python plugin/scripts/validate_plugin.py`, `RVT_SKIP_LARGE=1 .venv/bin/python -m pytest -q $(grep -v '^#' tests/ci_shard.txt | xargs)`,
            plus the stream-local tests named in the PR/issue (never the full suite).
            Before pushing, `git fetch origin BRANCH`: if the remote branch moved past HEAD, a session pushed meanwhile — STOP
            without pushing (post the marker comment saying you yielded). Otherwise commit with a plain message and
            `git push origin HEAD:BRANCH`. Then post ONE PR comment: what was wrong, what you changed, gate results — LAST line exactly:
            <!-- claude-autofix attempt=${{ steps.pr.outputs.attempts }} -->
            (post that marker comment even if you could not fix it or yielded, saying what is left).
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(.venv/bin/python:*),Bash(python3:*),Bash(bash scripts/cloud-setup.sh),Bash(ls:*),Bash(cat:*),Bash(xargs:*),Bash(grep:*)"
