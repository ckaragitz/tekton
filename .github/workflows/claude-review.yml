name: claude-review

# Automatic review of every PR push, with a machine-readable verdict and a bounded
# auto-fix ladder. Flow per head SHA:
#   review (≤80 turns) -> verdict marker  <!-- claude-review: approve|nits|changes sha=<sha> -->
#   no marker (turn cap / crash) -> a short "verdict rescue" pass posts it; still none -> red, and
#                                    automerge re-requests the review once (workflow_dispatch below)
#   changes + attempts<N  -> fix pass pushes commits to the PR branch (re-triggers CI + review)
#   changes + attempts>=N -> label `bot-stuck` (NOT a human dead-end): after a quiet day the board's
#                            sweep re-queues the issue `ready`+`retry` so a fresh session or the
#                            unattended worker continues on the same branch with a fresh budget
#                            (budget = attempt markers since the last <!-- claude-autofix reset -->).
# N and the other knobs live in .github/autonomy.json on the default branch (pipeline.max_fix_attempts).
# automerge.yml merges when CI is green AND the verdict for the exact head SHA is approve/nits.
#
# Needs ONE repo secret set by the repo admin (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  (`claude setup-token` on a Pro/Max plan)  — or —  ANTHROPIC_API_KEY
# plus the Claude GitHub App installed on the repo (github.com/apps/claude).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:       # automerge (or a human: Actions → claude-review → Run) re-requests a review
    inputs:
      pr:
        description: "PR number to (re-)review at its current head"
        required: true
  workflow_run:            # red CI on a PR head -> bounded auto-fix pass (job ci-autofix below)
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # Shared bash for both jobs, loaded with:  eval "$REVIEW_LIB"   (needs GH_TOKEN, REPO, and $comments
  # = the PR's comments as JSON). The markers are the contract with automerge.yml and
  # tools/dev/techlead.py (tests/test_techlead.py pins them): verdict, attempt, reset, exhausted.
  REVIEW_LIB: |
    cfg_max_fix() {   # pipeline.max_fix_attempts from the DEFAULT branch's .github/autonomy.json
      local d; d=$(gh api "repos/$REPO" --jq .default_branch)
      gh api "repos/$REPO/contents/.github/autonomy.json?ref=$d" --jq .content 2>/dev/null | base64 -d 2>/dev/null | jq -r '.pipeline.max_fix_attempts // 3' 2>/dev/null || echo 3
    }
    # attempts = auto-fix attempt markers since the last budget reset marker (posted when an
    # issue is re-queued to a fresh holder), in comment order.
    attempts_since_reset() {
      jq -r '[.[].body] | reduce .[] as $b (0; if ($b|contains("<!-- claude-autofix reset -->")) then 0 elif ($b|test("<!-- claude-autofix attempt=[0-9]+ -->")) then .+1 else . end)' <<<"$comments"
    }
    park_stuck() {    # $1=pr $2=sha $3=why — label bot-stuck + one explanatory comment per sha (never needs-human)
      gh label create bot-stuck --repo "$REPO" --color b60205 >/dev/null 2>&1 || true
      gh pr edit "$1" --repo "$REPO" --add-label bot-stuck >/dev/null
      if ! jq -r '.[].body' <<<"$comments" | grep -qF "<!-- claude-autofix exhausted sha=$2 -->"; then
        gh pr comment "$1" --repo "$REPO" --body "🤖 **Out of automatic fix attempts** and $3. Labelled \`bot-stuck\` — this is not a dead end: if nothing moves for a day, the board's sweep re-queues the linked issue (\`ready\` + \`retry\`) so a fresh session or the unattended worker continues **on this branch** with a new budget. Anyone may act sooner: push a fix, comment \`@claude <specific instruction>\`, or \`/claim\` the issue. <!-- claude-autofix exhausted sha=$2 -->" >/dev/null
      fi
    }

jobs:
  claude-review:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Require a credential (fail red, never skip quietly)
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repo secret. Repo admin: run 'claude setup-token' locally and add it as CLAUDE_CODE_OAUTH_TOKEN under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Resolve the PR under review
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EV_PR: ${{ github.event.pull_request.number }}
          IN_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr="${EV_PR:-$IN_PR}"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::pr input must be a number, got '$pr'"; exit 1; }
          j=$(gh pr view "$pr" --repo "$REPO" --json number,headRefOid,headRefName,isDraft,state)
          [ "$(jq -r .state <<<"$j")" = "OPEN" ] || { echo "::error::PR #$pr is not open"; exit 1; }
          eval "$REVIEW_LIB"
          {
            echo "pr=$pr"
            echo "sha=$(jq -r .headRefOid <<<"$j")"
            echo "ref=$(jq -r .headRefName <<<"$j")"
            echo "draft=$(jq -r .isDraft <<<"$j")"
            echo "max_fix=$(cfg_max_fix)"
          } >> "$GITHUB_OUTPUT"
          echo "reviewing #$pr at $(jq -r .headRefOid <<<"$j") ($EVENT)"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ctx.outputs.sha }}
          fetch-depth: 0

      - name: Review
        id: review
        continue-on-error: true      # a turn-cap exit must not skip the verdict rescue below
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.ctx.outputs.pr }}
            HEAD SHA: ${{ steps.ctx.outputs.sha }}

            You are the automated reviewer AND the merge gatekeeper for this repository; the
            contributors are not developers, so your verdict decides whether this PR merges.
            Read CLAUDE.md at the repo root first — sections 1 (hard rules), 3b (plugin sources vs
            generated mirrors) and 4 (PR requirements) are the standard. Review ONLY this PR's diff
            (`gh pr diff`), reading full files where needed to judge correctness. Also read the
            linked issue (`Closes #N` → `gh issue view N`) and check its DONE criteria are met, and
            run `gh pr list --state open` to detect another open PR for the same issue.
            Budget your turns: post the summary comment (step 2 below) BEFORE you run out — a review
            without the verdict marker is worthless to the merge machinery.

            Blocking (→ verdict `changes`):
            - hard-rule violations (refusal logic instead of labels; reading Autodesk install dirs;
              donor/sample-derived bytes entering src/ tools/ plugin/ skills/; secrets; non-portable paths)
            - correctness bugs with a concrete failure scenario
            - edits to GENERATED mirrors (plugin/lib/**, plugin/skills/*/scripts/*.py except _bootstrap.py,
              plugin/skills/tekton-ifc/**, plugin/assets/**, plugin/marketplace.json) instead of sources,
              or src/tools/skills edits without the synced mirror (`tools/sync_plugin.py`)
            - the linked issue's DONE clearly not met, or no linked issue at all
            - a "loads/opens in Revit" claim without a docs/coverage/viewer-certified.json entry
            - this PR duplicates an OLDER open PR for the same issue (say which; the older one wins)
            Non-blocking (→ `nits`): style, record bookkeeping, small hygiene gaps, optional improvements.
            A PR opened by the unattended worker (branch `bot/…`, author claude[bot]) is held to exactly
            the same standard — no bonus, no penalty.

            Output, in this order:
            1. Inline comments for line-anchored findings (only real ones).
            2. Exactly ONE summary comment via `gh pr comment`, starting with a verdict line —
               `✅ Approve`, `🟡 Nits only`, or `🛑 Changes requested` — then ≤8 bullets, most severe
               first, each with file:line and the concrete failure scenario or the exact fix wanted.
               Write for a non-developer's coding assistant: each blocking bullet must say precisely
               what to change. No praise padding, no diff restating.
            3. The LAST line of that summary comment must be exactly one of:
               <!-- claude-review: approve sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: nits sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: changes sha=${{ steps.ctx.outputs.sha }} -->
            Do not push commits in this step.
          claude_args: |
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Glob,Grep"

      - name: Verdict marker present?
        id: v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qE "<!-- claude-review: (approve|nits|changes) sha=$SHA -->"; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "found=no" >> "$GITHUB_OUTPUT"; echo "::warning::review pass ended without a verdict marker for $SHA (outcome: ${{ steps.review.outcome }}) — running the rescue pass"
          fi

      - name: Verdict rescue (short second pass, only when the marker is missing)
        if: steps.v1.outputs.found != 'yes'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}   PR: ${{ steps.ctx.outputs.pr }}   HEAD SHA: ${{ steps.ctx.outputs.sha }}
            A review pass of this PR just ended WITHOUT posting its verdict (it ran out of turns or
            crashed). Your only job: post the ONE summary comment with the verdict, fast.
            1. `gh pr view ${{ steps.ctx.outputs.pr }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ steps.ctx.outputs.pr }}/comments`
               to read any inline findings the first pass already left; `gh pr diff` to see the change;
               read CLAUDE.md §1 if you need the hard rules. Do not re-review from scratch beyond what a
               verdict needs; do not post inline comments; do not push.
            2. Post exactly ONE `gh pr comment`: first line `✅ Approve`, `🟡 Nits only` or `🛑 Changes requested`,
               ≤6 bullets (blocking ones say exactly what to change), LAST line exactly one of:
               <!-- claude-review: approve sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: nits sha=${{ steps.ctx.outputs.sha }} -->
               <!-- claude-review: changes sha=${{ steps.ctx.outputs.sha }} -->
               When genuinely unable to judge, choose `changes` and say what a reviewer must check —
               never approve blind.
          claude_args: |
            --max-turns 25
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(gh issue view:*),Read,Grep,Glob"

      - name: Read verdict + decide on auto-fix
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          SHA: ${{ steps.ctx.outputs.sha }}
          MAX_FIX_ATTEMPTS: ${{ steps.ctx.outputs.max_fix }}
        run: |
          set -euo pipefail
          eval "$REVIEW_LIB"
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate)
          verdict=$(jq -r '.[].body' <<<"$comments" | grep -oE "<!-- claude-review: (approve|nits|changes) sha=$SHA -->" | tail -1 | sed -E 's/.*: (approve|nits|changes) .*/\1/' || true)
          attempts=$(attempts_since_reset)
          [ -z "$verdict" ] && { echo "::error::no verdict marker for $SHA even after the rescue pass — automerge re-requests this review once, then parks the PR as bot-stuck (a PR that edits this very workflow can never be bot-reviewed: the action refuses modified copies; the owner reviews it)"; exit 1; }
          echo "verdict=$verdict"   >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          fix=no
          if [ "$verdict" = "changes" ]; then
            if [ "$attempts" -lt "$MAX_FIX_ATTEMPTS" ]; then fix=yes
            else park_stuck "$PR" "$SHA" "the review still requests changes after $attempts attempt(s) since the last budget reset"; fi
          fi
          echo "fix=$fix" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict attempts=$attempts/$MAX_FIX_ATTEMPTS fix=$fix"

      - name: Prepare Python env for the fix pass
        if: steps.verdict.outputs.fix == 'yes'
        env:
          REF: ${{ steps.ctx.outputs.ref }}
          SHA: ${{ steps.ctx.outputs.sha }}
        run: |
          git checkout -B "$REF" "$SHA"
          git config user.name  "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          bash scripts/cloud-setup.sh || echo "::warning::cloud-setup.sh failed; fix pass runs without a prepared venv"

      - name: Auto-fix pass (bounded)
        if: steps.verdict.outputs.fix == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}   PR: ${{ steps.ctx.outputs.pr }}   BRANCH: ${{ steps.ctx.outputs.ref }}
            This is auto-fix attempt number ${{ steps.verdict.outputs.attempts }} + 1 of ${{ steps.ctx.outputs.max_fix }}.

            The automated review of this PR requested changes. Read CLAUDE.md, then read the latest
            review summary comment and inline comments on the PR (`gh pr view --comments`, `gh api`).
            Address every BLOCKING bullet with the smallest correct change, staying inside the linked
            issue's territory. If a bullet says this PR duplicates an older open PR, do NOT fix code:
            post a comment recommending this PR be closed in favour of the older one and stop.
            If this is the LAST attempt (attempt + 1 == max), prefer the change that certainly clears the
            blocking bullets even if it narrows scope — and file the narrowed-out remainder as a follow-up
            issue with `gh issue create` (title = its checkable DONE, labels: ready + the area) so nothing is lost.

            After editing: if you touched src/, tools/ or skills/, run `.venv/bin/python tools/sync_plugin.py`;
            run `.venv/bin/python tools/dev/check_portable_paths.py`, `.venv/bin/python plugin/scripts/validate_plugin.py`,
            and the stream-local tests named in the PR/issue (never the full suite). Only if those pass:
            commit with a plain message describing the fix and push to BRANCH (`git push origin HEAD:BRANCH`;
            if the push is rejected because the branch moved, `git pull --rebase origin BRANCH` once and push again).
            Then post ONE PR comment summarising what you changed and the gate results, whose LAST line is exactly:
            <!-- claude-autofix attempt=${{ steps.verdict.outputs.attempts }} -->
            (post that marker comment even if you could not fix everything, saying what is left).
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(.venv/bin/python:*),Bash(python:*),Bash(python3:*),Bash(bash scripts/cloud-setup.sh),Bash(ls:*),Bash(cat:*)"

  ci-autofix:
    # CI finished RED for a pull request head (a normal PR run, or a run automerge dispatched on the
    # PR branch): read the failed logs, fix, run gates, push (bounded by the same reset-aware budget).
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Require a credential (fail red, never skip quietly)
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then echo "::error::No CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secret — cannot auto-fix red CI."; exit 1; fi
      - name: Resolve the PR + attempt budget
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          eval "$REVIEW_LIB"
          pr=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number,headRefOid --jq '.[]|select(.headRefOid=="'"$SHA"'")|.number' | head -1)
          if [ -z "$pr" ]; then echo "no open PR whose head is $SHA on $BRANCH (superseded by a newer push, or a main run) — nothing to fix"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          max=$(cfg_max_fix)
          # shellcheck disable=SC2034   # read by attempts_since_reset / park_stuck from REVIEW_LIB
          comments=$(gh api "repos/$REPO/issues/$pr/comments" --paginate)
          attempts=$(attempts_since_reset)
          gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -300 > /tmp/ci-failed.log || true
          { echo "pr=$pr"; echo "attempts=$attempts"; echo "max=$max"; } >> "$GITHUB_OUTPUT"
          if [ "$attempts" -ge "$max" ]; then
            park_stuck "$pr" "$SHA" "CI is still red (run $RUN_ID) after $attempts attempt(s)"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.pr.outputs.go == 'yes'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Prepare Python env
        if: steps.pr.outputs.go == 'yes'
        run: |
          git config user.name  "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          bash scripts/cloud-setup.sh || echo "::warning::cloud-setup.sh failed; fix pass runs without a prepared venv"
      - name: Auto-fix red CI (bounded)
        if: steps.pr.outputs.go == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}   PR: #${{ steps.pr.outputs.pr }}   BRANCH: ${{ github.event.workflow_run.head_branch }}
            CI run ${{ github.event.workflow_run.id }} finished RED for this PR's head. This is auto-fix attempt
            ${{ steps.pr.outputs.attempts }} + 1 of ${{ steps.pr.outputs.max }}.

            Read CLAUDE.md first. The failed-step log tail is at /tmp/ci-failed.log (also: `gh run view ${{ github.event.workflow_run.id }} --log-failed`).
            Diagnose the actual failure (portable paths / sync_plugin drift / validate_plugin / a test in
            tests/ci_shard.txt), make the smallest correct fix inside the PR's territory — never weaken a gate
            or delete a test to go green; if the right fix is outside the PR's territory or needs samples/viewer,
            say so in a comment and stop. If you touched src/, tools/ or skills/, run `.venv/bin/python tools/sync_plugin.py`.
            Re-run locally exactly what CI runs: `.venv/bin/python tools/dev/check_portable_paths.py`,
            `.venv/bin/python tools/sync_plugin.py --check`, `.venv/bin/python plugin/scripts/validate_plugin.py`,
            `RVT_SKIP_LARGE=1 .venv/bin/python -m pytest -q $(grep -v '^#' tests/ci_shard.txt | xargs)`.
            Only if green: commit with a plain message and push to BRANCH (`git push origin HEAD:BRANCH`; on a
            rejected push, `git pull --rebase origin BRANCH` once and push again). Then post ONE PR comment: what failed,
            what you changed, gate results — LAST line exactly:
            <!-- claude-autofix attempt=${{ steps.pr.outputs.attempts }} -->
            (post the marker comment even if you could not fix it, stating what is left).
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh api:*),Bash(gh issue view:*),Bash(.venv/bin/python:*),Bash(python:*),Bash(python3:*),Bash(bash scripts/cloud-setup.sh),Bash(ls:*),Bash(cat:*),Bash(xargs:*),Bash(grep:*)"
