name: claude

# Mention @claude in an issue or PR comment/review to have it answer, review, or
# implement (it pushes to the PR branch / opens a PR from an issue). Only users with
# write access can trigger it. Same secret requirement as claude-review.yml.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Require a credential (fail red, never skip quietly)
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" != "true" ] && [ "$HAS_KEY" != "true" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repo secret configured — see the header of .github/workflows/claude-review.yml."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python env for the session (so it can run the repo's gates)
        run: bash scripts/cloud-setup.sh || echo "::warning::cloud-setup.sh failed; the session will run without a prepared venv"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 80
