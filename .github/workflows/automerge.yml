name: automerge

# The merge machine. No human step on the happy path — and no silent dead-ends off it:
#   PR + CI green on the exact head SHA + claude-review verdict approve/nits for that SHA
#     -> squash-merge, delete branch, close the linked issues ourselves (a bot merge does not
#        always fire GitHub's closing-keyword linker; #50 stayed open after #51 merged).
#   draft that is green + approved and QUIET (no commits for pipeline.quiet_minutes, default 90;
#     the session that owned it is gone or done) -> marked ready automatically, then merged.
#     Label `wip` (or `do-not-merge`) holds a draft indefinitely.
#   no verdict for the head SHA and no review running -> re-request the review once per SHA
#     (claude-review.yml workflow_dispatch); still nothing hours later -> `bot-stuck`.
#     Exception: a PR that edits claude-review.yml itself can never be bot-reviewed (the review
#     action refuses to run a modified copy) -> `needs-human` at once, owner reviews + merges.
#   approved + green but CONFLICTING -> dispatch the worker's rebase mode once per SHA.
#   PR changes .github/workflows/** -> GitHub forbids GITHUB_TOKEN to merge it: merged with the
#     optional AUTOMERGE_TOKEN secret (a fine-grained PAT of the owner with contents+pull-requests+
#     workflows write) if present, else `session-merge` = the next CODING SESSION squash-merges it
#     with its own (human-identity) credentials (steer #61: sessions do what bots cannot; nothing
#     waits on the owner) — but ONLY on the approved path: a ✅/🟡 verdict for the exact head SHA and
#     green CI are prerequisites for the label, workflow files being what runs with the repo's
#     secrets (#88). A PR that edits the reviewer itself gets its verdict from a review dispatched on
#     the DEFAULT branch's copy of claude-review.yml (the pull_request-run refuses a modified copy);
#     if no independent verdict can be produced for a workflow-file PR within the re-request window,
#     it falls back to `needs-human`: a collaborator other than the author applies merge-when-green.
#   red CI or verdict `changes` -> a live coding session fixes it first; only when
#     now - max(head commit, red-CI completion, `changes` verdict, last fix attempt) >= pipeline.fix_grace_minutes
#     (default 15) do we dispatch ONE bot fix pass (claude-review.yml mode=fix, from the default
#     branch) per (sha, attempt) — no session/bot double-fixing, and a PR whose session or laptop
#     went away is still picked up (steer #67).
#   CI gate = every check on the head EXCEPT the repo's own bot jobs (IGNORED_CHECKS below; the same
#     list is BOT_CHECK_NAMES in tools/dev/techlead.py, pinned by tests): a cancelled board render or a
#     coord pr-check landing on a PR head is not CI and must never block a merge.
# Escape hatches: label `do-not-merge` holds a PR; label `merge-when-green` applied by a
# collaborator other than the author (or by the repo owner) substitutes for the AI verdict
# (use it when the review bot is down or wrong). It never "skips green": zero CI checks are
# dispatched, red checks or no verdict = refuse and say why. Duplicate PRs for the same issue:
# the OLDEST open PR wins; newer ones get `duplicate-pr` and the tech-lead planner closes one.
#
# This is bash on the built-in token BY DESIGN: it checks out nothing, so a broken tools/dev/*.py
# on main can never halt merging. tools/dev/techlead.py `pr_status()` mirrors this decision order
# for the board and tests/test_techlead.py pins the shared vocabulary (labels, markers, the
# closing-keyword grammar, the config defaults) — change both sides together.
# Knobs: .github/autonomy.json on the default branch. Sweeps on: review/CI workflows finishing,
# labels, ready-for-review, every 30 min, manual.

on:
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_run:
    workflows: ["CI", "claude-review"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write   # dispatch CI / claude-review / worker on PR heads that need them

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sweep open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          # coord.py's closing-keyword grammar (CLOSING there): keyword, optional colon, whitespace,
          # #N; HTML comments do not count. One grammar for coord, the board and the merge machine.
          CLOSES_PY: |
            import re, sys
            b = re.sub(r"<!--.*?-->", " ", sys.stdin.read(), flags=re.S)
            nums = {int(n) for n in re.findall(r"(?<![\w-])(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)", b, re.I)}
            print("\n".join(str(n) for n in sorted(nums)))
        shell: bash
        run: |
          set -euo pipefail
          say() { echo "::notice::$*"; }
          closes_of() { python3 -c "$CLOSES_PY"; }          # PR body on stdin -> issue numbers it closes
          # Per-PR comment cache: fetched once ($cbodies), consulted by has_marker, extended by comment_once.
          has_marker() { grep -qF -- "<!-- automerge:$1 -->" <<<"$cbodies"; }
          comment_once() {  # $1=marker $2=body — one comment per (pr, marker)
            has_marker "$1" && return 0
            gh pr comment "$pr" --repo "$REPO" --body "$2"$'\n\n'"<!-- automerge:$1 -->" >/dev/null
            cbodies+=$'\n'"<!-- automerge:$1 -->"
          }
          has_label() { [[ "$labels" == *",$1,"* ]]; }
          add_label() { has_label "$1" && return 0; gh label create "$1" --repo "$REPO" --color "${2:-cfd3d7}" >/dev/null 2>&1 || true; gh pr edit "$pr" --repo "$REPO" --add-label "$1" >/dev/null || true; labels+="$1,"; }
          drop_label() { has_label "$1" || return 0; gh api -X DELETE "repos/$REPO/issues/$pr/labels/$1" >/dev/null 2>&1 || true; }
          # verdict_for <sha>: newest verdict marker whose sha field is a >=12-hex PREFIX of <sha> (exact
          # normally; tolerant of a model dropping trailing digits, seen once on #89). Reads $cbodies.
          verdict_for() {   # `|| true`: under pipefail a no-match grep must not abort the sweep (see #199)
            { grep -oE "<!-- claude-review: (approve|nits|changes) sha=[0-9a-f]{12,40} -->" <<<"$cbodies" || true; } \
              | awk -v s="$1" '{ split($4, kv, "="); if (index(s, kv[2]) == 1) v = $3 } END { print v }'
          }
          age_min() {  # minutes since an ISO timestamp (0 for empty)
            [ -n "${1:-}" ] || { echo 0; return; }
            echo $(( ( $(date -u +%s) - $(date -u -d "$1" +%s) ) / 60 ))
          }
          newest() { printf '%s\n' "$@" | grep -v '^$' | sort | tail -1; }   # latest of several ISO timestamps
          maybe_dispatch_fix() {  # $1=why — one bot fix pass per (sha, attempt), only after the grace window (steer #67)
            local why="$1" attempts t_verdict t_attempt last quiet key
            attempts=$(awk 'index($0,"<!-- claude-autofix reset -->"){n=0} /<!-- claude-autofix attempt=[0-9]+ -->/{n++} END{print n+0}' <<<"$cbodies")
            [ "$attempts" -ge "$MAX_FIX" ] && { say "#$pr: fix budget spent ($attempts/$MAX_FIX) — the fix/review jobs park it bot-stuck"; return 0; }
            t_verdict=$(grep -E -- "<!-- claude-review: changes sha=[0-9a-f]{12,40} -->" <<<"$cbodies" | awk -v s="$sha" '{ n=split($0, parts, "sha="); split(parts[n], kv, " "); if (index(s, kv[1]) == 1) t = $1 } END { print t }' || true)
            t_attempt=$(grep -E -- "<!-- claude-autofix attempt=[0-9]+ -->" <<<"$cbodies" | tail -1 | cut -d' ' -f1 || true)
            last=$(newest "$t_head" "$t_red" "$t_verdict" "$t_attempt")
            quiet=$(age_min "$last")
            if [ "$quiet" -lt "$FIX_GRACE_MIN" ]; then say "#$pr: $why — grace ${quiet}/${FIX_GRACE_MIN} min: a live session goes first"; return 0; fi
            key="fix-dispatch-${sha}-${attempts}"
            has_marker "$key" && { say "#$pr: fix pass already dispatched for ${sha:0:7} (attempt $((attempts+1)))"; return 0; }
            if gh workflow run claude-review.yml --repo "$REPO" --ref "$DEFAULT" -f pr="$pr" -f mode=fix >/dev/null 2>fx.err; then
              comment_once "$key" "🔧 ${why} on \`${sha:0:7}\` and no new push for ${quiet} min (grace ${FIX_GRACE_MIN}), so I dispatched the **bot fix pass** (attempt $((attempts+1))/${MAX_FIX}). A live session would have gone first; if yours is about to push, just push — the bot yields to a newer head."
              say "#$pr: dispatched fix pass ($why, attempt $((attempts+1))/${MAX_FIX})"
            else
              echo "::warning::#$pr: could not dispatch the fix pass: $(tr '\n' ' ' <fx.err | cut -c1-200)"
            fi
          }

          # The repo's own bot jobs are not CI (see header). Keep in step with BOT_CHECK_NAMES in tools/dev/techlead.py.
          IGNORED_CHECKS='"automerge","claude-review","fix","ci-autofix","claude","render","refresh-board","claim","single-holder","issue-intake","pr-check","sweep","gate","plan","pick","implement","file-issues"'
          merged_any=0

          DEFAULT=$(gh api "repos/$REPO" --jq .default_branch)
          CFG=$(gh api "repos/$REPO/contents/.github/autonomy.json?ref=$DEFAULT" --jq .content 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
          QUIET_MIN=$(jq -r '.pipeline.quiet_minutes // 90' <<<"$CFG")
          REVIEW_WAIT_MIN=$(jq -r '.pipeline.review_wait_minutes // 20' <<<"$CFG")     # give a running/queued review this long
          STUCK_AFTER_MIN=$(jq -r '.pipeline.review_stuck_minutes // 240' <<<"$CFG")   # re-requested and still nothing -> bot-stuck
          FIX_GRACE_MIN=$(jq -r '.pipeline.fix_grace_minutes // 15' <<<"$CFG")         # a live session gets this long before a bot fix pass
          MAX_FIX=$(jq -r '.pipeline.max_fix_attempts // 3' <<<"$CFG")

          all=$(gh pr list --repo "$REPO" --state open --limit 100 \
                  --json number,title,author,isDraft,mergeable,headRefOid,headRefName,labels,body,files,createdAt)
          prs=$(jq -r 'sort_by(.number)|.[].number' <<<"$all")
          [ -z "$prs" ] && { say "no open PRs"; exit 0; }
          runs=""   # claude-review runs, fetched lazily (only the no-verdict path needs them)

          # issue -> oldest open PR that closes it (duplicate rule)
          declare -A first_for_issue=()
          for n in $prs; do
            for iss in $(jq -r --argjson n "$n" '.[]|select(.number==$n)|.body' <<<"$all" | closes_of); do
              [ -z "${first_for_issue[$iss]:-}" ] && first_for_issue[$iss]=$n
            done
          done

          for pr in $prs; do
            echo "── PR #$pr"
            j=$(jq --argjson n "$pr" '.[]|select(.number==$n)' <<<"$all")
            title=$(jq -r .title <<<"$j"); author=$(jq -r .author.login <<<"$j"); sha=$(jq -r .headRefOid <<<"$j")
            draft=$(jq -r .isDraft <<<"$j"); mergeable=$(jq -r .mergeable <<<"$j"); branch=$(jq -r .headRefName <<<"$j")
            labels=",$(jq -r '[.labels[].name]|join(",")' <<<"$j"),"
            touches_wf=$(jq -r '[.files[].path|select(startswith(".github/workflows/"))]|length' <<<"$j")
            touches_reviewer=$(jq -r '[.files[].path|select(.==".github/workflows/claude-review.yml")]|length' <<<"$j")
            closes=$(jq -r .body <<<"$j" | closes_of)
            cbodies=$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq '.[]|(.created_at + " " + (.body|gsub("[\r\n]";" ")))')

            has_label do-not-merge && { say "#$pr held by do-not-merge"; continue; }
            if has_label needs-human; then
              # The human gate holds or lifts depending on WHY it was set (marker comments per head):
              #  * merge refused by GitHub at this head  -> a true stop: a human clears it, or a new push moves the head;
              #  * no independent verdict at this head   -> lifts itself once the approval it asked for exists
              #    (`merge-when-green`, validated as non-author below, or a verdict for THIS sha);
              #  * neither marker matches this head        -> the head moved since the label: re-evaluate afresh.
              if has_marker "merge-failed-$sha"; then
                say "#$pr waiting on a human (GitHub refused the merge at ${sha:0:7})"; continue
              elif has_marker "review-stuck-$sha"; then
                if has_label merge-when-green || [[ "$(verdict_for "$sha")" =~ ^(approve|nits)$ ]]; then
                  drop_label needs-human; say "#$pr: needs-human lifted (approval now present for ${sha:0:7}) — re-evaluating"
                else
                  say "#$pr waiting on a human (no independent verdict for ${sha:0:7})"; continue
                fi
              else
                drop_label needs-human; say "#$pr: head moved since needs-human was set — re-evaluating"
              fi
            fi
            if has_label session-merge && [ -z "${MERGE_TOKEN:-}" ]; then say "#$pr waiting for a coding session to merge it"; continue; fi

            # Duplicate rule: an older open PR closes the same issue -> park this one for the planner.
            dup=""
            for iss in $closes; do
              f=${first_for_issue[$iss]:-}; if [ -n "$f" ] && [ "$f" != "$pr" ]; then dup="#$f (issue #$iss)"; fi
            done
            if [ -n "$dup" ]; then
              add_label duplicate-pr d93f0b
              comment_once "dup-$sha" "👯 This PR and $dup both close the same issue; the **older PR wins** by rule, so this one is parked (\`duplicate-pr\`). The tech-lead planner closes whichever is worse on its next run; a human may decide sooner by closing one. (Claim the issue *before* starting — \`/claim\` or \`/next\` — and this cannot happen.)"
              say "#$pr duplicate of $dup"; continue
            fi
            drop_label duplicate-pr

            # CI gate on the exact head SHA (ignore automerge itself and the claude* review checks).
            checks=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" \
                       --jq "[.check_runs[]|select(.name|IN($IGNORED_CHECKS)|not)|select(.name|startswith(\"claude\")|not)|{name,status,conclusion,completed_at}]")
            total=$(jq length <<<"$checks"); pending=$(jq '[.[]|select(.status!="completed")]|length' <<<"$checks")
            bad=$(jq -r '[.[]|select(.status=="completed" and (.conclusion|IN("success","neutral","skipped")|not))|.name]|join(", ")' <<<"$checks")
            ok=$(jq '[.[]|select(.conclusion=="success")]|length' <<<"$checks")
            t_red=$(jq -r '[.[]|select(.status=="completed" and (.conclusion|IN("success","neutral","skipped")|not))|.completed_at // empty]|max // ""' <<<"$checks")
            t_head=$(gh api "repos/$REPO/commits/$sha" --jq .commit.committer.date 2>/dev/null || echo "")

            # Zero checks on the head (pushes via API/app tokens don't always trigger CI):
            # dispatch CI on the branch ourselves, once per head SHA, instead of stalling.
            if [ "$total" = "0" ]; then
              if has_marker "ci-dispatch-$sha"; then
                say "#$pr: CI already dispatched for ${sha:0:7}; waiting for its checks"
              elif [ "$(gh api "repos/$REPO/branches/$branch" --jq .commit.sha 2>/dev/null)" = "$sha" ] \
                   && gh workflow run CI --repo "$REPO" --ref "$branch" >/dev/null 2>&1; then
                comment_once "ci-dispatch-$sha" "🚀 No CI checks existed for \`${sha:0:7}\`, so I dispatched **CI** on \`$branch\`. Once it's green (and the review verdict is in) I merge automatically."
                say "#$pr: dispatched CI on $branch"
              else
                comment_once "no-checks-$sha" "🟥 No CI checks exist for \`${sha:0:7}\` and I could not dispatch **CI** for it (branch moved, or Actions may not run workflows here). Push a commit (or re-run **CI**) and I'll continue automatically."
                say "#$pr zero checks, dispatch failed"
              fi
              continue
            fi
            if [ "$pending" != "0" ]; then say "#$pr: $pending check(s) running"; continue; fi
            if [ -n "$bad" ]; then
              comment_once "red-$sha" "🟥 CI is red on \`${sha:0:7}\` (failed: $bad). Your session goes first: fix and push, I re-check every new commit. If nothing is pushed within ${FIX_GRACE_MIN} min I dispatch the bot fix pass myself (budget ${MAX_FIX}), so a PR nobody is watching still moves."
              maybe_dispatch_fix "CI red ($bad)"
              say "#$pr red"; continue
            fi
            if [ "$ok" = "0" ]; then say "#$pr: no successful checks"; continue; fi

            # Approval: AI verdict for THIS sha, or a human label from someone other than the author.
            verdict=$(verdict_for "$sha")
            approved_by=""
            case "$verdict" in approve|nits) approved_by="claude-review ($verdict)";; esac
            if [ -z "$approved_by" ] && has_label merge-when-green; then
              labeler=$(gh api "repos/$REPO/issues/$pr/events" --paginate --jq '[.[]|select(.event=="labeled" and .label.name=="merge-when-green")]|last|.actor.login // ""')
              if [ "$labeler" != "$author" ] || [ "$author" = "$OWNER" ]; then approved_by="label by @$labeler"
              else gh pr edit "$pr" --repo "$REPO" --remove-label merge-when-green >/dev/null || true
                   comment_once "self-label-$sha" "🔁 \`merge-when-green\` must come from someone other than the author (it substitutes for review). Removed."; fi
            fi

            if [ -z "$approved_by" ]; then
              if [ "$verdict" = "changes" ]; then maybe_dispatch_fix "review requested changes"; continue; fi
              # No verdict for this SHA (a PR that edits claude-review.yml never gets one from its own
              # pull_request run — the action refuses a modified copy — but the DEFAULT branch's reviewer,
              # dispatched below, judges it like any other diff: an independent verdict is required
              # before anyone may merge a workflow-file PR, #88).
              # If no review is running or recent for it, re-request once.
              [ -n "$runs" ] || runs=$(gh run list --repo "$REPO" --workflow claude-review.yml --limit 40 --json headSha,status,createdAt,event 2>/dev/null || echo '[]')
              live=$(jq --arg s "$sha" --arg c "$(date -u -d "$REVIEW_WAIT_MIN minutes ago" +%Y-%m-%dT%H:%M:%SZ)" \
                       '[.[]|select((.headSha==$s and (.status!="completed" or .createdAt > $c)) or (.event=="workflow_dispatch" and .status!="completed"))]|length' <<<"$runs")
              if [ "$live" != "0" ]; then say "#$pr: review running/recent for ${sha:0:7} — waiting"; continue; fi
              if ! has_marker "review-dispatch-$sha"; then
                if gh workflow run claude-review.yml --repo "$REPO" --ref "$DEFAULT" -f pr="$pr" -f mode=review >/dev/null 2>rr.err; then
                  extra=""; [ "$touches_reviewer" != "0" ] && extra=" (this PR edits the reviewer, so the review runs from \`$DEFAULT\`'s copy of it — an independent verdict is required before any session may merge a workflow-file PR)"
                  comment_once "review-dispatch-$sha" "🔎 No review verdict exists for \`${sha:0:7}\` and no review is running, so I re-requested **claude-review** for it${extra}. I continue as soon as the verdict and CI agree."
                  say "#$pr: re-requested review for ${sha:0:7}"
                else
                  comment_once "review-dispatch-$sha" "🔎 No review verdict for \`${sha:0:7}\`, and re-requesting the review failed (\`$(tr '\n' ' ' <rr.err | cut -c1-160)\`). Push any commit and the review runs on the new head."
                  say "#$pr: review dispatch failed"
                fi
              else
                ts=$(grep -F -- "<!-- automerge:review-dispatch-$sha -->" <<<"$cbodies" | tail -1 | cut -d' ' -f1 || true)
                if [ "$(age_min "$ts")" -ge "$STUCK_AFTER_MIN" ]; then
                  if [ "$touches_wf" != "0" ]; then
                    if ! has_label needs-human; then
                      add_label needs-human b60205
                      comment_once "review-stuck-$sha" "🧑 **Needs a human approval.** No independent review verdict could be produced for \`${sha:0:7}\` after re-requesting it, and this PR changes \`.github/workflows/**\` — the files that run with the repository's secrets — so it will not be merged on a session's say-so alone. **A collaborator other than the author** reads the diff and applies \`merge-when-green\` (or the owner squash-merges); I lift \`needs-human\` myself on the next sweep once that label — or a verdict for the current head — is present, and a session may then perform the merge. Pushing any commit re-arms the automatic review."
                    fi
                  elif ! has_label bot-stuck; then
                    add_label bot-stuck b60205
                    comment_once "review-stuck-$sha" "🤖 Still no review verdict for \`${sha:0:7}\` hours after re-requesting it. Labelled \`bot-stuck\`; the board's sweep re-queues the linked issue for a fresh holder if nothing moves. A push of any commit re-arms the whole pipeline; a collaborator other than the author may also apply \`merge-when-green\`."
                  fi
                fi
                say "#$pr: no review verdict for ${sha:0:7} yet (already re-requested)"
              fi
              continue
            fi

            if [ "$draft" = "true" ]; then
              has_label wip && { say "#$pr: draft held by wip"; continue; }
              quiet=$(age_min "$t_head")
              if [ "$quiet" -ge "$QUIET_MIN" ]; then
                if gh pr ready "$pr" --repo "$REPO" >/dev/null 2>rd.err; then
                  comment_once "auto-ready-$sha" "🟢 Green, approved ($approved_by) and quiet for ${quiet} min (≥ ${QUIET_MIN}), so I marked this draft **ready** — the session that opened it is done or gone, and finished work should not wait for a click. Merging next. (To keep a draft parked, label it \`wip\`.)"
                  say "#$pr: auto-marked ready after ${quiet} quiet min"; draft=false
                else
                  echo "::warning::#$pr: gh pr ready failed: $(tr '\n' ' ' <rd.err | cut -c1-200)"; continue
                fi
              else
                comment_once "draft-green-$sha" "🟢 CI is green and the review says **$verdict** on \`${sha:0:7}\`, but this PR is still a **draft**. If you are done, mark it **Ready for review** (\`gh pr ready $pr\`) and it merges within minutes. If you just walk away, that is fine too: after ${QUIET_MIN} minutes without new commits I mark it ready and merge it myself. Label \`wip\` to keep it parked."
                say "#$pr: draft, quiet ${quiet}/${QUIET_MIN} min"; continue
              fi
            fi

            use_token="$GH_TOKEN"
            if [ "$touches_wf" != "0" ]; then
              if [ -n "${MERGE_TOKEN:-}" ]; then
                use_token="$MERGE_TOKEN"; say "#$pr touches workflows — merging with AUTOMERGE_TOKEN"
              else
                add_label session-merge 1d76db
                comment_once "wf-$sha" "🧑‍💻 **For a coding session to merge** (\`session-merge\`). Approved ($approved_by) for exactly \`${sha:0:7}\` and green, but this PR changes \`.github/workflows/**\` and GitHub does not let the Actions token merge workflow changes. **Next coding session — preferably not the one that authored it: re-check that the head is still \`${sha:0:7}\`, CI is green and the verdict above is for that SHA, read the workflow diff once more (these files run with the repo's secrets), then squash-merge with your own credentials** — \`gh pr merge $pr --squash --match-head-commit $sha\` or the GitHub MCP \`merge_pull_request\` tool. Never merge a workflow-file PR that lacks a verdict for its head (steer #61, hardened in #88). To make this hands-free, the owner may add a fine-grained personal access token (contents + pull requests + workflows: write on this repo) as the Actions secret \`AUTOMERGE_TOKEN\`."
                say "#$pr touches workflows — session merge"; continue
              fi
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              add_label needs-rebase d93f0b
              if ! has_marker "rebase-dispatch-$sha"; then
                if gh workflow run worker.yml --repo "$REPO" --ref "$DEFAULT" -f mode=rebase -f pr="$pr" >/dev/null 2>rb.err; then
                  comment_once "rebase-dispatch-$sha" "⚠️ Approved and green, but \`${sha:0:7}\` conflicts with \`$DEFAULT\`. I dispatched the **worker (rebase mode)** to merge \`$DEFAULT\` in and resolve the conflicts on this branch; I merge the result once it is green and reviewed. (Your own session may do it first: \`git fetch && git merge origin/$DEFAULT\`, resolve, push.)"
                  say "#$pr: conflicts — rebase job dispatched"
                else
                  comment_once "conflict-$sha" "⚠️ Approved and green, but it conflicts with \`$DEFAULT\` and I could not dispatch the rebase job (\`$(tr '\n' ' ' <rb.err | cut -c1-160)\`). Ask a session to \`git fetch && git merge origin/$DEFAULT\`, resolve, and push; I'll merge the new head automatically."
                  say "#$pr conflicts, dispatch failed"
                fi
              else
                say "#$pr: conflicts — rebase already dispatched for ${sha:0:7}"
              fi
              continue
            fi
            drop_label needs-rebase
            if [ "$mergeable" != "MERGEABLE" ]; then say "#$pr mergeable=$mergeable (computing) — retry next sweep"; continue; fi

            echo "merging #$pr at ${sha:0:7} — $approved_by, $ok green check(s)"
            if GH_TOKEN="$use_token" gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$sha" --subject "$title (#$pr)" >/tmp/m.log 2>&1; then
              say "#$pr merged ($approved_by)"; merged_any=1
              # Close the linked issues ourselves: merges by the Actions token do not reliably fire
              # GitHub's closing-keyword linker, and an issue left open falls back into the queue.
              for iss in $closes; do
                st=$(gh api "repos/$REPO/issues/$iss" --jq '.state + " " + (.pull_request|type)' 2>/dev/null || echo "")
                [ "${st%% *}" = "open" ] || continue
                [[ "$st" == *object* ]] && continue      # a PR, not an issue
                gh issue close "$iss" --repo "$REPO" --reason completed --comment "✅ Closed by #$pr (squash-merged by automerge at \`${sha:0:7}\`)." >/dev/null 2>&1 \
                  && say "#$pr: closed linked issue #$iss" || echo "::warning::#$pr: could not close #$iss"
                for l in bot-working retry; do gh api -X DELETE "repos/$REPO/issues/$iss/labels/$l" >/dev/null 2>&1 || true; done
              done
            else
              err=$(tr '\n' ' ' </tmp/m.log | cut -c1-400); add_label needs-human b60205
              comment_once "merge-failed-$sha" "🛑 Squash-merge at \`${sha:0:7}\` refused by GitHub: \`$err\`. Owner: merge by hand, or fix the cause and push — a fresh verdict for the new head (or a non-author \`merge-when-green\`) lifts \`needs-human\` automatically."
              echo "::warning::#$pr merge failed: $err"
            fi
          done
          # Merges by this token raise no events: refresh the board once ourselves.
          if [ "$merged_any" = "1" ]; then gh workflow run board.yml --repo "$REPO" --ref "$DEFAULT" >/dev/null 2>&1 || true; fi
